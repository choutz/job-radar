name: Scrape and Enrich Jobs

on:
  schedule:
    - cron: '0 5 * * *'   # 12 AM CDT (10 AM UTC) — scrape
    - cron: '0 11 * * *'    # 6 AM CDT (2 AM UTC)  — nightly digest
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (all, scrape, email)'
        required: false
        default: 'all'

jobs:
  scrape:
    # Run if:
    # 1. It's a scheduled event but NOT the 6 AM UTC (9 PM CST) digest time
    # 2. OR it's a manual trigger for 'all' or 'scrape'
    if: |
      (github.event_name == 'schedule' && github.event.schedule != '0 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'scrape'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Scrape and enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

  email:
    # Run if:
    # 1. It's a scheduled event and IS the 3 AM UTC (9 PM CST) digest time
    # 2. OR it's a manual trigger for 'all' or 'email'
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'email'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python emailer.py